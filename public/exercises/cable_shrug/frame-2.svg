<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background -->
  <rect width="200" height="200" fill="transparent" />
  
  <!-- Base Ground Line -->
  <line x1="40" y1="160" x2="160" y2="160" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Abstract Figure Body -->
  <path d="M100 160 L100 90" stroke="#555" stroke-width="8" stroke-linecap="round"/>
  <circle cx="100" cy="65" r="15" fill="#555"/>
  
  <!-- Arms animating based on frame -->
  <path d="M100 100 Q70 110 50 100" stroke="#888" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M100 100 Q130 110 150 100" stroke="#888" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Abstract Equipment (Dumbbell/Barbell/Cable) -->
  <circle cx="50" cy="100" r="6" fill="#ef4444"/>
  <circle cx="150" cy="100" r="6" fill="#ef4444"/>
</svg>